<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720">
  <!-- Repeating background tile: faint snippets of config, code and shell -->
  <g fill="#c4c4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    <text x="24" y="30">server {</text>
    <text x="24" y="48">    listen 443 ssl http2;</text>
    <text x="24" y="66">    server_name example.com;</text>
    <text x="24" y="84">    root /var/www/html/web;</text>
    <text x="24" y="120">    location / {</text>
    <text x="24" y="138">        try_files $uri /index.php?$query_string;</text>
    <text x="24" y="156">    }</text>
    <text x="24" y="174">    location ~ \.php$ {</text>
    <text x="24" y="192">        fastcgi_pass php:9000;</text>
    <text x="24" y="210">    }</text>
    <text x="24" y="228">}</text>
    <text x="24" y="264">$ drush sql:sync @prod @self -y</text>
    <text x="24" y="282">$ drush cr &amp;&amp; drush updb -y</text>
    <text x="24" y="300"> [success] Cache rebuild complete.</text>
    <text x="24" y="336">$ wp search-replace 'http://' 'https://' --all-tables</text>
    <text x="24" y="354">Success: Made 1,284 replacements.</text>
    <text x="24" y="390">&lt;?php</text>
    <text x="24" y="408">function rescue_site(array $site): bool {</text>
    <text x="24" y="426">  if ($site['status'] !== 200) {</text>
    <text x="24" y="444">    return migrate($site, 'new-host');</text>
    <text x="24" y="462">  }</text>
    <text x="24" y="480">  return TRUE;</text>
    <text x="24" y="498">}</text>
    <text x="24" y="534">SecRule REQUEST_HEADERS:User-Agent \</text>
    <text x="24" y="552">    "@pmFromFile bad-bots.txt" \</text>
    <text x="24" y="570">    "id:100042,phase:1,deny,status:403"</text>
    <text x="24" y="606">$ composer update drupal/core-* -W</text>
    <text x="24" y="624">  - Upgrading drupal/core (10.3.6 =&gt; 11.0.5)</text>
    <text x="24" y="660">$ tail -f /var/log/nginx/error.log</text>
    <text x="520" y="30">$ dig +short example.com</text>
    <text x="520" y="48">104.21.32.7</text>
    <text x="520" y="84">$ curl -sI https://example.com | head -1</text>
    <text x="520" y="102">HTTP/2 200</text>
    <text x="520" y="138">sub vcl_recv {</text>
    <text x="520" y="156">  if (req.url ~ "^/admin") {</text>
    <text x="520" y="174">    return (pass);</text>
    <text x="520" y="192">  }</text>
    <text x="520" y="210">}</text>
    <text x="520" y="246">$ git log --oneline -3</text>
    <text x="520" y="264">a1f9c2e Cut over DNS, 0s downtime</text>
    <text x="520" y="282">7be04d1 Tune WAF rule 942100</text>
    <text x="520" y="300">3c88e90 Move public files to S3</text>
    <text x="520" y="336">environments:</text>
    <text x="520" y="354">  main:</text>
    <text x="520" y="372">    routes:</text>
    <text x="520" y="390">      - nginx: www.example.com</text>
    <text x="520" y="408">    cronjobs:</text>
    <text x="520" y="426">      - name: drush cron</text>
    <text x="520" y="444">        schedule: "*/15 * * * *"</text>
    <text x="520" y="462">        command: drush cron</text>
    <text x="520" y="498">$ rsync -avz --delete files/ prod:/var/www/files/</text>
    <text x="520" y="516">sent 1.2G bytes  received 48K bytes</text>
    <text x="520" y="552">$ redis-cli info stats | grep hit</text>
    <text x="520" y="570">keyspace_hits:9734211</text>
    <text x="520" y="606">$ certbot renew --quiet</text>
    <text x="520" y="624">$ systemctl reload nginx</text>
  </g>
</svg>
